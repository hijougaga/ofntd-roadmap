<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0910">
<meta name="description" content="Old Five Nights Tower Defense public update roadmap.">
<title>OFNTD | Public Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* THEME: You can also change these values in CONFIG.theme below. */
:root{color-scheme:dark;--bg:#09090d;--panel:#17131f;--accent:#a77aff;--text:#f6f1ff;--muted:#aaa1b9;--border:#423451;--glow:#a77aff35}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.075;background:repeating-linear-gradient(0deg,transparent 0 3px,#aaa 4px 5px)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 80% 0%,var(--glow),transparent 48%),radial-gradient(ellipse at 10% 60%,var(--glow),transparent 52%)}
.wrap{max-width:1120px;margin:auto;padding:0 24px}.top{position:sticky;top:0;z-index:10;background:#0b0a10e8;border-bottom:1px solid #ffffff18;backdrop-filter:blur(14px)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:900 26px 'Barlow Condensed',Impact,sans-serif;letter-spacing:1.5px;text-decoration:none;color:var(--text)}.brand span{color:var(--accent)}.navright{display:flex;align-items:center;gap:20px}.navright a{color:var(--text);text-decoration:none;font-size:12px;font-weight:700}.pill{font-size:10px;font-weight:800;letter-spacing:1.3px;border:1px solid var(--border);border-radius:99px;padding:10px 13px;color:var(--accent)}
.hero{padding:94px 0 78px;position:relative}.eyebrow,.kicker{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2.7px}.hero h1{font:900 clamp(68px,12vw,144px)/.82 'Barlow Condensed',Impact,sans-serif;letter-spacing:-1px;margin:24px 0 0}.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1.5px var(--accent)}.hero p{max-width:600px;color:var(--muted);font-size:15px;line-height:1.85;margin:30px 0}.actions{display:flex;flex-wrap:wrap;gap:12px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:13px 19px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:1px;transition:transform .18s,filter .18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.primary{background:var(--accent);color:#100a18}.secondary{border:1px solid var(--border);color:var(--text)}.hero-mark{position:absolute;right:6%;top:75px;font:900 240px/.9 'Barlow Condensed',sans-serif;color:var(--glow);opacity:.35;pointer-events:none;transform:rotate(-10deg)}.divider{height:1px;background:linear-gradient(90deg,var(--accent),var(--border),transparent)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:64px 0 26px}.section-head h2{font:800 45px 'Barlow Condensed',sans-serif;margin:7px 0 0}.subtle{font-size:12px;color:var(--muted)}.timeline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:linear-gradient(150deg,var(--panel),#100f16 90%);border:1px solid var(--border);border-radius:11px;overflow:hidden;position:relative;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:var(--accent)}.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),transparent)}.card-top{padding:28px 28px 20px}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px}.date{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}.status{font-size:10px;letter-spacing:.7px;font-weight:800;padding:7px 9px;border-radius:5px;border:1px solid var(--border);color:var(--text);background:#ffffff08;white-space:nowrap}.status.released{color:#a0ebbd;border-color:#357c56;background:#153d2655}.status.today{color:#ffd18d;border-color:#916132;background:#4b301555}.status.delayed{color:#ffb0ad;border-color:#a24b49;background:#51202055}.card h3{font:800 37px/1.04 'Barlow Condensed',sans-serif;margin:26px 0 12px}.desc{font-size:13px;line-height:1.75;color:var(--muted);min-height:46px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:17px 0 4px}.tag{font-size:11px;color:var(--text);background:var(--glow);border:1px solid var(--border);border-radius:4px;padding:7px 9px}.card-bottom{border-top:1px solid #ffffff12;padding:18px 28px 22px;background:#ffffff03;display:flex;align-items:center;justify-content:space-between;gap:12px}.count-label{font-size:10px;color:var(--muted);letter-spacing:1.2px;font-weight:800}.count{font:800 21px 'Barlow Condensed',sans-serif;text-align:right;letter-spacing:.4px}.number{position:absolute;right:22px;top:55px;font:900 90px 'Barlow Condensed',sans-serif;color:#ffffff07;pointer-events:none}.notice{border:1px solid var(--border);background:var(--panel);border-radius:9px;margin:34px 0 75px;padding:22px 24px;color:var(--muted);font-size:13px;line-height:1.7}.notice strong{color:var(--text)}.footer{border-top:1px solid #ffffff18;padding:28px 0 42px;color:var(--muted);font-size:12px}.footinner{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.footer strong{color:var(--accent)}.footer a{color:var(--accent)}
@media(max-width:700px){.wrap{padding:0 18px}.nav{min-height:64px}.navright .nav-link{display:none}.hero{padding:74px 0 60px}.hero h1{font-size:clamp(62px,18vw,110px)}.hero-mark{display:none}.timeline{grid-template-columns:1fr}.section-head h2{font-size:37px}.card-top{padding:24px 22px 16px}.card-bottom{padding:18px 22px}.card h3{font-size:34px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="#home" id="brand">OLD FIVE NIGHTS <span>TD</span></a><div class="navright"><a class="nav-link" href="#roadmap">ROADMAP</a><span class="pill">● PUBLIC ROADMAP</span></div></div></header>
<main id="home"><div class="wrap"><section class="hero"><div class="hero-mark" aria-hidden="true">05</div><div class="eyebrow" id="eyebrow"></div><h1 id="hero-title"></h1><p id="hero-description"></p><div class="actions"><a class="btn primary" href="#roadmap">EXPLORE UPDATES ↘</a><a class="btn secondary" href="#info">RELEASE INFO →</a></div></section><div class="divider"></div><section id="roadmap" aria-labelledby="roadmap-title"><div class="section-head"><div><div class="kicker" id="schedule-kicker"></div><h2 id="roadmap-title">WHAT'S COMING NEXT</h2></div><span class="subtle" id="update-total"></span></div><div class="timeline" id="timeline"></div></section><aside class="notice" id="info"><strong>ⓘ DEVELOPER NOTICE</strong><div id="notice-text"></div></aside></div></main>
<footer class="footer"><div class="wrap footinner"><span id="copyright"></span><span id="footer-message"></span></div></footer>
<script>
'use strict';
/* ==============================================================
   OFNTD ROADMAP SETTINGS — EDIT THIS SECTION ONLY!
   Date format: YYYY-MM-DDTHH:mm:ss+01:00 (include UTC offset).
   Use a real release time and offset when announced.
   Status: "auto", "released", "delayed", "development", "upcoming".
   "auto" shows SCHEDULED TODAY or DATE PASSED, never RELEASED.
   To add an update, copy one object in the updates array.
   ============================================================= */
const CONFIG = {
  gameName: 'Old Five Nights Tower Defense',
  brandHTML: 'OLD FIVE NIGHTS <span>TD</span>', // Trusted HTML; only edit yourself
  month: 'NOVEMBER',
  year: 2026,
  tagline: '// THE NEXT CHAPTER AWAITS',
  heroDescription: 'Four weeks. Four major updates. Discover what’s coming to Old Five Nights Tower Defense this November. The nights are only getting harder.',
  footerMessage: 'STAY ALERT. SURVIVE THE NIGHT.',
  // Add links here if you want buttons to appear in the hero:
  links: [
    // { label: 'JOIN DISCORD', url: 'https://discord.gg/YOURINVITE' },
    // { label: 'PLAY ON ROBLOX', url: 'https://www.roblox.com/games/YOURGAMEID' },
  ],
  theme: {
    background: '#09090d',
    panel: '#17131f',
    accent: '#a77aff',
    text: '#f6f1ff',
    muted: '#aaa1b9',
    border: '#423451'
  },
  updates: [
    {
      date: '2026-11-07T00:00:00+01:00',
      title: 'ENDLESS REWORK',
      description: 'A refreshed Endless experience, the arrival of Endless 4, and a new exclusive present.',
      tags: ['♾ Endless Rework', '🏰 Endless 4', '🎁 Biweekly Exclusive Present'],
      status: 'auto'
    },
    {
      date: '2026-11-14T00:00:00+01:00',
      title: 'EVOS',
      description: 'Evolutions are on the horizon. You’ll have to wait and see...',
      tags: ['⚡ Evos', '🎁 New AFK Present'],
      status: 'auto'
    },
    {
      date: '2026-11-21T00:00:00+01:00',
      title: 'Season 4',
      description: 'The military update continues, alongside a brand-new AFK present.',
      tags: ['🌌 Season 4', '🟣 PurpleGuy'],
      status: 'auto'
    },
    {
      date: '2026-11-28T00:00:00+01:00',
      title: 'CHRISTMAS',
      description: 'A new season begins. More details will be revealed closer to release.',
      tags: ['🎄 Christman Event', '🔒 More Soon'],
      status: 'auto'
    }
  ]
};
/* ===================== WEBSITE ENGINE ===================== */
const $ = id => document.getElementById(id);
const root = document.documentElement;
for (const [key, value] of Object.entries(CONFIG.theme)) {
  const names = {background:'bg',panel:'panel',accent:'accent',text:'text',muted:'muted',border:'border'};
  if (names[key] && /^#[0-9a-f]{6}$/i.test(value)) root.style.setProperty('--'+names[key], value);
}
// Accent glow uses CSS color-mix where supported; fallback is the default purple.
root.style.setProperty('--glow', `color-mix(in srgb, var(--accent) 19%, transparent)`);
document.title = `OFNTD | ${CONFIG.month} ${CONFIG.year} Roadmap`;
$('brand').innerHTML = CONFIG.brandHTML;
$('eyebrow').textContent = CONFIG.tagline;
$('hero-title').append(document.createTextNode(CONFIG.month));
const titleLine = document.createElement('span'); titleLine.textContent = 'ROADMAP.'; $('hero-title').append(titleLine);
$('hero-description').textContent = CONFIG.heroDescription;
$('schedule-kicker').textContent = `// ${CONFIG.year} RELEASE SCHEDULE`;
$('update-total').textContent = `${CONFIG.updates.length} SCHEDULED UPDATES / ${CONFIG.month} ${CONFIG.year}`;
$('copyright').textContent = `© ${CONFIG.year} ${CONFIG.gameName.toUpperCase()}`;
$('footer-message').textContent = CONFIG.footerMessage;
$('notice-text').textContent = 'These dates are planned and may change. Countdown times use the UTC offset entered in the site settings. A date passing does not confirm an update was released. The developer controls release status manually.';
const actions = document.querySelector('.actions');
for (const link of CONFIG.links) {
  try {
    const url = new URL(link.url);
    if (!['https:', 'http:'].includes(url.protocol)) continue;
    const a = document.createElement('a');a.className='btn secondary';a.href=url.href;a.textContent=link.label;a.target='_blank';a.rel='noopener noreferrer';actions.append(a);
  } catch { /* Skip invalid URLs */ }
}
const cards = [];
const sortedUpdates = [...CONFIG.updates].sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));
for (const [index, update] of sortedUpdates.entries()) {
  const releaseTime = Date.parse(update.date);
  if (!Number.isFinite(releaseTime)) { console.warn('Invalid update date:', update.title); continue; }
  const article = document.createElement('article');article.className='card';
  const number = document.createElement('div');number.className='number';number.textContent=String(index+1).padStart(2,'0');article.append(number);
  const top = document.createElement('div');top.className='card-top';
  const meta = document.createElement('div');meta.className='meta';
  const date = document.createElement('span');date.className='date';
  date.textContent = new Intl.DateTimeFormat('en-US',{month:'short',day:'2-digit',year:'numeric',timeZone:'UTC'}).format(new Date(update.date.slice(0,10)+'T12:00:00Z')).toUpperCase();
  const status = document.createElement('span');status.className='status';status.textContent='UPCOMING';
  meta.append(date,status);
  const heading = document.createElement('h3');heading.textContent=update.title;
  const description = document.createElement('div');description.className='desc';description.textContent=update.description;
  const tags = document.createElement('div');tags.className='tags';
  for (const tagText of update.tags) {const tag=document.createElement('span');tag.className='tag';tag.textContent=tagText;tags.append(tag)}
  top.append(meta,heading,description,tags);
  const bottom = document.createElement('div');bottom.className='card-bottom';
  const countLabel = document.createElement('span');countLabel.className='count-label';countLabel.textContent='RELEASE COUNTDOWN';
  const count = document.createElement('span');count.className='count';count.textContent='CALCULATING...';
  bottom.append(countLabel,count);article.append(top,bottom);$('timeline').append(article);
  cards.push({update,releaseTime,status,count,countLabel});
}
function updateCountdowns() {
  const now=Date.now();
  for (const {update,releaseTime,status,count,countLabel} of cards) {
    const remaining=releaseTime-now;
    let label='UPCOMING', detail='', kind='';
    const override=String(update.status||'auto').toLowerCase();
    if (override==='released') {label='RELEASED';detail='UPDATE RELEASED';kind='released'}
    else if (override==='delayed') {label='DELAYED';detail='NEW DATE TO BE ANNOUNCED';kind='delayed'}
    else if (override==='development') {label='IN DEVELOPMENT';detail='WORK IN PROGRESS'}
    else if (override==='upcoming' || remaining>0) {
      label='UPCOMING';
      const seconds=Math.max(0,Math.ceil(remaining/1000));
      const days=Math.floor(seconds/86400), hours=Math.floor(seconds%86400/3600), minutes=Math.floor(seconds%3600/60), secs=seconds%60;
      detail=`${days}D ${String(hours).padStart(2,'0')}H ${String(minutes).padStart(2,'0')}M ${String(secs).padStart(2,'0')}S`;
    } else if (remaining > -86400000) {label='SCHEDULED TODAY';detail='RELEASE DATE TODAY';kind='today'}
    else {label='DATE PASSED';detail='AWAITING CONFIRMATION'}
    if (status.textContent!==label) status.textContent=label;
    status.className='status'+(kind?' '+kind:'');
    if (count.textContent!==detail) count.textContent=detail;
    countLabel.textContent=override==='released'?'STATUS':override==='delayed'?'SCHEDULE':'RELEASE COUNTDOWN';
  }
}
updateCountdowns();
// Only update once per second while the page is visible.
let timer=null;
function syncTimer(){if(document.hidden){clearInterval(timer);timer=null}else{updateCountdowns();if(timer===null)timer=setInterval(updateCountdowns,1000)}}
document.addEventListener('visibilitychange',syncTimer);syncTimer();
</script>
</body>
</html>
